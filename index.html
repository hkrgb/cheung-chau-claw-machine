<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>長洲海濱 3D 夾公仔</title><link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="mobile-modal-fix-v1.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"}}</script></head><body>
<main id="game" class="game"><div class="harbour"></div><canvas id="scene" aria-label="3D 夾公仔機"></canvas><div class="vignette"></div>
<header class="brand"><small>CHEUNG CHAU HARBOUR CLAW</small><h1>長洲海濱<br><em>3D 夾公仔</em></h1></header>
<section class="hud"><div><small>現有分數</small><b id="balance">0</b><i>分</i></div><div><small>每次遊戲</small><b>200</b><i>分</i></div><div><small>收藏</small><b id="collectionCount">0</b><i>隻</i></div></section>
<section class="machine-sign"><span>海島珍藏</span><small>ISLAND PRIZE DEPOT</small></section>
<section class="status"><small id="roundLabel">READY</small><strong id="message">投入 200 分開始</strong><div class="strength"><i id="strengthFill"></i></div></section>
<section class="controls" aria-label="操作台"><button id="left" aria-label="夾爪向左"><span>←</span><i>LEFT</i></button><button id="drop" class="drop"><span>落爪</span><i>DROP</i></button><button id="right" aria-label="夾爪向右"><span>→</span><i>RIGHT</i></button></section>
<button id="returnStory" class="return">回到故事 <span>→</span></button>
<div id="startModal" class="modal"><section><small>WELCOME TO THE HARBOUR ARCADE</small><h2>今晚，帶一隻<br>長洲回憶返屋企。</h2><p>按住左右移動 3D 夾爪，觀察公仔位置及重心，再按「落爪」。準繩度越高，夾力越穩。</p><div class="price"><span>PLAY CREDIT</span><b>200 分／次</b></div><button id="start">投入 200 分</button><p id="startMessage" class="notice"></p></section></div>
<div id="resultModal" class="modal hidden"><section class="result"><small id="resultEyebrow">PRIZE CAPTURED</small><div id="resultPreview"></div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button id="again">再玩一次・200 分</button><button id="close" class="ghost">留在機台</button></div></section></div>
<div id="loading" class="loading"><i></i><span>正在亮起機台燈光…</span></div></main><script type="module" src="game.js?v=3"></script></body></html>
